[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winemood"
version = "0.2.0"
description = "Research on the language of wine tasting notes and critic score bands."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Caio Venancio" }]
requires-python = ">=3.11,<3.14"
# TensorFlow and tf-keras must share the same minor version. tf-keras provides
# the Keras 2 APIs (Tokenizer, HDF5 loading) used by the legacy artifacts.
# Versions verified together: tensorflow 2.20.0, tf-keras 2.20.1 (Python 3.13).
dependencies = [
    "tensorflow>=2.20,<2.21",
    "tf-keras>=2.20,<2.21",
    "streamlit>=1.50,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "nltk>=3.9,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Third-party deprecation noise from TensorFlow/Keras internals.
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:tf_keras.*",
    "ignore::DeprecationWarning:keras.*",
    "ignore::DeprecationWarning:gast.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
