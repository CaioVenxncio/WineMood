name: CI

on:
  push:
    branches: [main, modernization]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same Ruff minor version as the [dev] extra, so formatting matches local runs.
      - run: pip install "ruff==0.17.*"
      - run: ruff check .
      - run: ruff format --check .

  test-light:
    # The deployment configuration: no TensorFlow / PyTorch / Transformers.
    # Neural tests skip themselves; everything else (incl. the app) must pass.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
      - run: pytest

  test-neural:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,neural]"
      - run: pytest
