name: CI

on:
  push:
    branches: [main, modernization]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same Ruff minor version as the [dev] extra, so formatting matches local runs.
      - run: pip install "ruff==0.17.*"
      - run: ruff check .
      - run: ruff format --check .

  test-light:
    # The deployment configuration: no TensorFlow / PyTorch / Transformers.
    # Neural tests skip themselves; everything else (incl. the app) must pass.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
      - run: pytest

  deploy-check:
    # Mirrors Streamlit Community Cloud: a non-editable install from requirements.txt
    # (the pinned deployment set) on the recommended Python version, then the app
    # tests and a live server health check against that exact environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: No neural frameworks in the deployment environment
        run: python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('tensorflow', 'torch', 'transformers')))"
      - run: pip install "pytest>=8,<10"
      - run: pytest tests/test_app_services.py tests/test_app_ui.py
      - name: Server starts and reports healthy
        run: |
          streamlit run app.py --server.port 8501 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1

  test-neural:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,neural]"
      - run: pytest
